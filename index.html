<!-- Librerías de soporte -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio en Vivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .radio-card {
            background: #161616;
            border: 1px solid #222;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            width: 320px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        .radio-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #ffcc00;
            letter-spacing: 0.5px;
        }
        .metadata-box {
            background: #222222;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #now-playing {
            font-size: 13px;
            color: #00ffcc;
            word-break: break-word;
            line-height: 1.4;
        }
        audio {
            width: 100%;
            outline: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="radio-card">
        <div class="radio-title">RADIO EN VIVO</div>
        
        <div class="metadata-box">
            <span id="now-playing">Conectando con el servidor...</span>
        </div>

        <audio id="player" controls autoplay>
            <source src="https://stream.zeno.fm/now76ljxdeftv" type="audio/aac">
            Tu navegador no soporta el elemento de audio.
        </audio>
    </div>

    <script>
        // Script inteligente para consultar los metadatos oficiales de Zeno.fm en tiempo real
        async function fetchZenoMetadata() {
            try {
                // Zeno.fm expone la información del stream en formato JSON mediante su endpoint público de montajes
                const response = await fetch('https://api.zeno.fm/mounts/metadata/now76ljxdeftv');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.title) {
                        document.getElementById('now-playing').innerText = data.title;
                    } else {
                        document.getElementById('now-playing').innerText = "Transmitiendo señal en directo";
                    }
                }
            } catch (error) {
                document.getElementById('now-playing').innerText = "Reproduciendo señal en línea";
            }
        }

        // Consultar al iniciar y luego refrescar cada 10 segundos automáticamente
        fetchZenoMetadata();
        setInterval(fetchZenoMetadata, 10000);
    </script>

</body>
</html>
