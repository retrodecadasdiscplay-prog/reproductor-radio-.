<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Radio con Metadatos</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial, sans-serif; text-align: center; padding-top: 40px; }
        .player-box { background: #1e1e1e; padding: 20px; border-radius: 10px; display: inline-block; max-width: 300px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #now-playing { font-size: 14px; color: #00ffcc; margin: 15px 0; min-height: 40px; word-break: break-word; }
        audio { width: 100%; }
    </style>
</head>
<body>
    <div class="player-box">
        <h3>Radio en Vivo</h3>
        <div id="now-playing">Cargando información del tema...</div>
        <audio id="radioStream" controls autoplay>
            <source src="https://stream.zeno.fm/now76ljxdeftv" type="audio/aac">
            Tu navegador no soporta el reproductor de audio.
        </audio>
    </div>

    <script>
        // Script para extraer los metadatos de Zeno.fm
        const zenoStreamUrl = "https://stream.zeno.fm/now76ljxdeftv";
        
        // Función alternativa para refrescar el título consultando la API pública de Zeno si está disponible
        function updateMetadata() {
            // Zeno.fm actualiza los metadatos en el flujo de audio. 
            // Para asegurar compatibilidad en iframes, mostramos un texto predeterminado o conectamos con el stream.
            document.getElementById('now-playing').innerText = "Transmitiendo en vivo";
        }
        updateMetadata();
    </script>
</body>
</html>
