<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELESTIAL RADIO La Voz De Jesus Hecha En Musica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0b0b0b;
            overflow: hidden;
        }
        .blur-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('https://i.postimg.cc/yNTqpT2j/Celestialradio.png') no-repeat center center;
            background-size: cover;
            filter: blur(12px);
            opacity: 0.4;
            z-index: -1;
        }
        .radio-container {
            background: rgba(22, 22, 22, 0.85);
            border: 1px solid #333;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .logo-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #774900;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 15px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .audio-box {
            width: 100%;
        }
        audio {
            width: 100%;
            outline: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="blur-bg"></div>

    <div class="radio-container">
        <img src="https://i.postimg.cc/yNTqpT2j/Celestialradio.png" alt="Celestial Radio" class="logo-img">
        <h1>CELESTIAL RADIO La Voz De Jesus Hecha En Musica</h1>
        
        <div class="audio-box">
            <audio controls autoplay>
                <source src="https://stream.zeno.fm/now76ljxdeftv" type="audio/aac">
                Tu navegador no soporta el reproductor de audio.
            </audio>
        </div>
    </div>

</body>
</html>
